<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 274" width="640" role="img" aria-labelledby="t d" style="max-width: 100%; height: auto; font-family: 'Open Sans', 'Helvetica Neue', Arial, sans-serif; font-size: 13px;">
<title id="t">Vulnérabilités publiées pour l'interpréteur PHP, par an</title>
<desc id="d">Barres horizontales, fiches CVE du produit php:php par année de publication : 2022 8, 2023 7, 2024 18, 2025 13, 2026 au 17 septembre 14</desc>
<text x="0.0" y="18.0" fill="currentColor" fill-opacity="1" text-anchor="start" style="font-size: 15px; font-weight: bold;">Vulnérabilités publiées pour l'interpréteur PHP, par an</text>
