<text x="0.0" y="218.0" fill="currentColor" fill-opacity="0.65" text-anchor="start" style="font-size: 11px; font-weight: normal;">NVD, fiches pour cpe:2.3:a:php:php par année de publication, interrogé le 17 septembre 2026. La</text>
<text x="0.0" y="233.0" fill="currentColor" fill-opacity="0.65" text-anchor="start" style="font-size: 11px; font-weight: normal;">liste d'avis php-src sur GitHub donne 5, 18, 14 et 15 pour 2023 à 2026.</text>
<text x="0.0" y="248.0" fill="currentColor" fill-opacity="0.65" text-anchor="start" style="font-size: 11px; font-weight: normal;">PHP n'attribue pas de CVE à la plupart des problèmes de faible gravité ; la hausse de 2024 coïncide</text>
<text x="0.0" y="263.0" fill="currentColor" fill-opacity="0.65" text-anchor="start" style="font-size: 11px; font-weight: normal;">avec un audit externe financé. Les comptes ne se comparent pas entre langages.</text>
