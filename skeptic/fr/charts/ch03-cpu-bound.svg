<text x="0.0" y="302.0" fill="currentColor" fill-opacity="0.65" text-anchor="start" style="font-size: 11px; font-weight: normal;">The Computer Language Benchmarks Game, n-body, entrée la plus rapide par langage, mesurée sur un</text>
