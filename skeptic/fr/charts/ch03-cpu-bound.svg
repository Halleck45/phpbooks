<text x="0.0" y="362.0" fill="currentColor" fill-opacity="0.65" text-anchor="start" style="font-size: 11px; font-weight: normal;">de commande PHP fixe un tampon JIT mais pas opcache.jit, que PHP 8.4 désactive par défaut.</text>
