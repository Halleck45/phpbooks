<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 259" width="640" role="img" aria-labelledby="t d" style="max-width: 100%; height: auto; font-family: 'Open Sans', 'Helvetica Neue', Arial, sans-serif; font-size: 13px;">
