<rect x="150.0" y="128.0" width="7.5" height="20.0" rx="3" fill="#a5a49f" fill-opacity="1"/>
<text x="165.5" y="143.0" fill="currentColor" fill-opacity="0.85" text-anchor="start" style="font-size: 12px; font-weight: normal;">6.4 s</text>
<text x="140.0" y="171.0" fill="currentColor" fill-opacity="1" text-anchor="end" style="font-size: 13px; font-weight: normal;">Node.js</text>
