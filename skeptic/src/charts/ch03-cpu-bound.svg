<text x="140.0" y="199.0" fill="currentColor" fill-opacity="1" text-anchor="end" style="font-size: 13px; font-weight: normal;">Ruby</text>
<rect x="150.0" y="184.0" width="194.5" height="20.0" rx="3" fill="#a5a49f" fill-opacity="1"/>
<text x="352.5" y="199.0" fill="currentColor" fill-opacity="0.85" text-anchor="start" style="font-size: 12px; font-weight: normal;">166.7 s</text>
<text x="140.0" y="227.0" fill="currentColor" fill-opacity="1" text-anchor="end" style="font-size: 13px; font-weight: normal;">PHP</text>
<rect x="150.0" y="212.0" width="238.1" height="20.0" rx="3" fill="#2a78d6" fill-opacity="1"/>
