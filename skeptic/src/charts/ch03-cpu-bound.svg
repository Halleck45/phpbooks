<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 358" width="640" role="img" aria-labelledby="t d" style="max-width: 100%; height: auto; font-family: 'Open Sans', 'Helvetica Neue', Arial, sans-serif; font-size: 13px;">
<title id="t">CPU-bound work: n-body, elapsed seconds (lower is better)</title>
<desc id="d">Horizontal bars, fastest single-threaded program per language: Rust 2.2 seconds, C# 3.1, Java 6.0, Go 6.4, Node.js 8.6, Ruby 166.7, PHP 204.1, Python 360.0</desc>
<text x="0.0" y="18.0" fill="currentColor" fill-opacity="1" text-anchor="start" style="font-size: 15px; font-weight: bold;">CPU-bound work: n-body, elapsed seconds (lower is better)</text>
<text x="140.0" y="59.0" fill="currentColor" fill-opacity="1" text-anchor="end" style="font-size: 13px; font-weight: normal;">Rust</text>
<rect x="150.0" y="44.0" width="2.6" height="20.0" rx="3" fill="#a5a49f" fill-opacity="1"/>
<text x="160.6" y="59.0" fill="currentColor" fill-opacity="0.85" text-anchor="start" style="font-size: 12px; font-weight: normal;">2.2 s</text>
<text x="140.0" y="87.0" fill="currentColor" fill-opacity="1" text-anchor="end" style="font-size: 13px; font-weight: normal;">C#</text>
