<text x="578.0" y="255.0" fill="currentColor" fill-opacity="0.85" text-anchor="start" style="font-size: 12px; font-weight: normal;">360 s</text>
<line x1="150.0" y1="40.0" x2="150.0" y2="264.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.4"/>
<text x="0.0" y="302.0" fill="currentColor" fill-opacity="0.65" text-anchor="start" style="font-size: 11px; font-weight: normal;">The Computer Language Benchmarks Game, n-body, fastest entry per language, measured on an Intel</text>
<text x="0.0" y="317.0" fill="currentColor" fill-opacity="0.65" text-anchor="start" style="font-size: 11px; font-weight: normal;">i5-3330; PHP 8.4.1, Python 3.13, Ruby 3.4 with YJIT, Node.js 23.8. Checked 17 September 2026.</text>
<text x="0.0" y="332.0" fill="currentColor" fill-opacity="0.65" text-anchor="start" style="font-size: 11px; font-weight: normal;">Contributed programs, one core each; the C# and Java entries are ahead-of-time compiled builds. The</text>
<text x="0.0" y="347.0" fill="currentColor" fill-opacity="0.65" text-anchor="start" style="font-size: 11px; font-weight: normal;">PHP command line sets a JIT buffer but not opcache.jit, which PHP 8.4 disables by default.</text>
