<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" role="img" aria-labelledby="t d" style="max-width: 100%; height: auto; font-family: 'Open Sans', 'Helvetica Neue', Arial, sans-serif; font-size: 13px;">
<title id="t">PHPBench score by PHP version, same machine (higher is better)</title>
<desc id="d">Horizontal bars, thousands of points: PHP 5.6.40 288, 7.0.33 620, 7.1.33 700, 7.2.28 772, 7.3.15 816, 7.4.3 814, 8.0-dev 876, 8.0-dev with JIT 875</desc>
<text x="0.0" y="18.0" fill="currentColor" fill-opacity="1" text-anchor="start" style="font-size: 15px; font-weight: bold;">PHPBench score by PHP version, same machine (higher is better)</text>
<text x="160.0" y="59.0" fill="currentColor" fill-opacity="1" text-anchor="end" style="font-size: 13px; font-weight: normal;">PHP 5.6.40</text>
