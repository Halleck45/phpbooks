<line x1="170.0" y1="40.0" x2="170.0" y2="236.0" stroke="currentColor" stroke-width="1" stroke-opacity="0.4"/>
<text x="0.0" y="274.0" fill="currentColor" fill-opacity="0.65" text-anchor="start" style="font-size: 11px; font-weight: normal;">OpenBenchmarking.org, result 2002269-VE-PHPBENCHM24 by Michael Larabel, February 2020, Core</text>
<text x="0.0" y="289.0" fill="currentColor" fill-opacity="0.65" text-anchor="start" style="font-size: 11px; font-weight: normal;">i9-9900KS, Ubuntu 20.04, PHPBench 0.8.1, mean of three runs.</text>
<text x="0.0" y="304.0" fill="currentColor" fill-opacity="0.65" text-anchor="start" style="font-size: 11px; font-weight: normal;">PHPBench is a synthetic CPU micro-benchmark of the interpreter, not a web application. PHP 8.0 was a</text>
