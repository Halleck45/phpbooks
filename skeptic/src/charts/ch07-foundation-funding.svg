<title id="t">The PHP Foundation, thousands of US dollars per year</title>
<desc id="d">Two lines. Contributions received: 2022 712, 2023 419, 2024 684, 2025 731. Spent on engineers: 2022 133 (April to November), 2023 275, 2024 635, 2025 784 (total spending).</desc>
