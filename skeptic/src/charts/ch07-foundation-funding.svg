<text x="0.0" y="294.0" fill="currentColor" fill-opacity="0.65" text-anchor="start" style="font-size: 11px; font-weight: normal;">The PHP Foundation transparency reports for 2022, 2023, 2024 and 2025 (published November 2022,</text>
