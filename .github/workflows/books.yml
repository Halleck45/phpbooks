name: Books

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  MDBOOK_VERSION: 0.5.4
  PANDOC_VERSION: 3.7.0.2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      # Pages does not exist on a private repository of a free account. Deploy
      # only when it does, so the build stays green until the site is enabled.
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled on this repository: the site is built but not deployed."
          fi

      - name: Install mdBook
        run: |
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin
          mdbook --version

      # The EPUB script needs pandoc 3 (--split-level), plus bs4 and Pillow.
      - name: Install pandoc
        run: |
          curl -sSL -o pandoc.deb "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo apt-get update
          sudo apt-get install -y ./pandoc.deb python3-bs4 python3-pil
          rm pandoc.deb
          pandoc --version | head -1

      - name: Build the books and the landing page
        run: make dist

      - name: Print the PDF editions
        run: make pdf

      - name: Convert the EPUB editions
        run: make epub

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/upload-artifact@v4
        with:
          name: editions
          path: |
            _site/*/*.pdf
            _site/*/*.epub
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: editions
          path: editions

      - name: Name the files after their book
        run: |
          mkdir out
          for f in editions/*/book.* editions/*/book-fr.*; do
            book=$(basename "$(dirname "$f")")
            name=$(basename "$f")
            case "$name" in
              book.*) cp "$f" "out/$book-$GITHUB_REF_NAME.${name#book.}" ;;
              book-fr.*) cp "$f" "out/$book-fr-$GITHUB_REF_NAME.${name#book-fr.}" ;;
            esac
          done
          ls -l out

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes out/*.pdf out/*.epub
